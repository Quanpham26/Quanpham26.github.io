name: Build Custom Redroid imei phone

on:
  workflow_dispatch: 

jobs:
  build-redroid:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    
    - name: Maximize Build Disk Space
      uses: easimon/maximize-build-space@master
      with:
        root-reserve-mb: 2048
        swap-size-mb: 16384 # Tạo 16GB RAM ảo (Swap) để không bị sập lỗi tràn bộ nhớ (Out of Memory)
        remove-dotnet: 'true'
        remove-android: 'true'
        remove-haskell: 'true'
        remove-codeql: 'true'
        remove-docker-images: 'true'

    # Bước 2: Cài đặt các công cụ biên dịch mã nguồn Android cần thiết
    - name: Install Build Tools (Fix OK Luon)
      run: |
        sudo apt-get update
        # 1. Cài đặt các công cụ nền tảng bắt buộc để build Android
        sudo apt-get install git-core gnupg flex bison build-essential zip curl zlib1g-dev libc6-dev-i386 x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig python3 -y
        curl -k https://storage.googleapis.com/git-repo-downloads/repo > /usr/local/bin/repo
    
        chmod a+x /usr/local/bin/repo
    - name: Sync Source and Apply SIM Patches
      run: |
          # A. Cấu hình Git CHUẨN XÁC bên trong Server Crave
          git config --global user.name \"github-actions[bot]\"
          git config --global user.email \"41898282+github-actions[bot]@://github.com\"
          git config --global color.ui false

          # 2. Bắt đầu Khởi tạo và tải mã nguồn Redroid 11
          mkdir ~/redroid && cd ~/redroid
          

          # check supported branch in https://github.com/remote-android/redroid-patches.git
          repo init --no-repo-verify -u https://android.googlesource.com/platform/manifest --git-lfs --depth=1 -b android-11.0.0_r48
          mkdir ~/.repo
          # add local manifests
          git clone https://github.com/remote-android/local_manifests.git ~/redroid/.repo/local_manifests -b 11.0.0

          repo sync -c -j\$(nproc) --no-tags --no-clone-bundle

          # 3. Fake thông số phần cứng SIM
          sed -i '/public String getLine1NumberForDisplay/a\\    String customNumber = android.os.SystemProperties.get(\"ro.boot.custom_phone_number\", \"\");\\    if (!customNumber.isEmpty()) return customNumber;' frameworks/opt/telephony/src/com/android/internal/telephony/PhoneInterfaceManager.java
          sed -i '/public String getDeviceId/a\\    String customImei = android.os.SystemProperties.get(\"ro.boot.custom_imei\", \"\");\\    if (!customImei.isEmpty()) return customImei;' frameworks/opt/telephony/src/com/android/internal/telephony/PhoneSubInfoController.java
          sed -i '/public Bundle call/a\\    String customAndroidId = android.os.SystemProperties.get(\"ro.boot.custom_android_id\", \"\");\\    if (!customAndroidId.isEmpty()) { Bundle b = new Bundle(); b.putString(\"value\", customAndroidId); return b; }' frameworks/base/packages/SettingsProvider/src/com/android/providers/settings/SettingsProvider.java

          sed -i '/public int getDataNetworkType/a\\    return 20; // 20 tương ứng với NETWORK_TYPE_NR (5G) trong Android' frameworks/base/telephony/java/android/telephony/ServiceState.java
          
          git clone https://github.com/remote-android/redroid-patches.git ~/redroid-patches
          ~/redroid-patches/apply-patch.sh ~/redroid

          # 5. Biên dịch hệ điều hành
          git clone https://github.com/remote-android/redroid-doc.git
          cd redroid-doc/android-builder-docker
          docker build --build-arg userid=$(id -u) --build-arg groupid=$(id -g) --build-arg username=$(id -un) -t redroid-builder .
          
          #####################
          # start builder
          #####################
          docker run -it --rm --hostname redroid-builder --name redroid-builder -v ~/redroid:/src redroid-builder
          
          #####################
          # build redroid
          #####################
          cd /src
          source build/envsetup.sh
          lunch redroid_x86_64-userdebug
          m -j\$(nproc)
          
          # 6. Đóng gói sản phẩm
          cd out/target/product/redroid_x86_64/
          mkdir sys_mount && sudo mount -o loop system.img sys_mount
          mkdir ven_mount && sudo mount -o loop vendor.img ven_mount
          mkdir -p rootfs
          sudo cp -a sys_mount/* rootfs/
          sudo cp -a ven_mount/* rootfs/vendor/
          sudo umount sys_mount && sudo umount ven_mount
          
          cd rootfs
          sudo tar -c . | xz -T0 > ../redroid-custom-aosp.tar.xz     

    - name: Download Build Artifact
      run: |
        crave pull redroid/out/target/product/redroid_x86_64/redroid-custom-aosp.tar.xz

    - name: Upload Redroid Tarball to GitHub Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: redroid-custom-image
        path: /home/runner/redroid/out/target/product/redroid_x86_64/redroid-custom-image.tar.xz
        compression-level: 0
