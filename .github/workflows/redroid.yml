name: Build Custom Redroid imei phone

on:
  workflow_dispatch: 
jobs:
  build-redroid:
    runs-on: ubuntu-latest

    steps:  
    - name: Maximize Build Disk Space
      uses: easimon/maximize-build-space@master
      with:
        root-reserve-mb: 2048
        swap-size-mb: 16384 # Tạo 16GB RAM ảo (Swap) để không bị sập lỗi tràn bộ nhớ (Out of Memory)
        remove-dotnet: 'true'
        remove-android: 'true'
        remove-haskell: 'true'
        remove-codeql: 'true'
        remove-docker-images: 'true'
        
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        persist-credentials: true
    # Bước 2: Cài đặt các công cụ biên dịch mã nguồn Android cần thiết
    - name: Install Build Tools (Fix OK Luon)
      run: |
        sudo apt-get update
        # 1. Cài đặt các công cụ nền tảng bắt buộc để build Android
        mkdir ~/redroid && cd ~/redroid
        sudo apt-get install git-core gnupg flex bison build-essential zip curl zlib1g-dev libc6-dev-i386 x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig python3 -y
        sudo curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o /usr/local/bin/repo
        sudo chmod a+x /usr/local/bin/repo
        repo version
